<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qual é Meu Nome?</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Qual é Meu Nome?</h1>
    </header>

    <div id="message-container"></div>

    <div id="board">
      <!-- 6 rows x 5 tiles = 30 tiles, generated by JS -->
    </div>

    <div id="keyboard">
      <div class="keyboard-row">
        <button data-key="Q">Q</button>
        <button data-key="W">W</button>
        <button data-key="E">E</button>
        <button data-key="R">R</button>
        <button data-key="T">T</button>
        <button data-key="Y">Y</button>
        <button data-key="U">U</button>
        <button data-key="I">I</button>
        <button data-key="O">O</button>
        <button data-key="P">P</button>
      </div>
      <div class="keyboard-row">
        <div class="spacer-half"></div>
        <button data-key="A">A</button>
        <button data-key="S">S</button>
        <button data-key="D">D</button>
        <button data-key="F">F</button>
        <button data-key="G">G</button>
        <button data-key="H">H</button>
        <button data-key="J">J</button>
        <button data-key="K">K</button>
        <button data-key="L">L</button>
        <div class="spacer-half"></div>
      </div>
      <div class="keyboard-row">
        <button data-key="ENTER" class="key-wide">ENTER</button>
        <button data-key="Z">Z</button>
        <button data-key="X">X</button>
        <button data-key="C">C</button>
        <button data-key="V">V</button>
        <button data-key="B">B</button>
        <button data-key="N">N</button>
        <button data-key="M">M</button>
        <button data-key="BACKSPACE" class="key-wide">&#9003;</button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <button id="modal-close">&times;</button>
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <div id="stats-container">
          <div class="stat">
            <span class="stat-value" id="stat-played">0</span>
            <span class="stat-label">Jogos</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-win-pct">0</span>
            <span class="stat-label">Vitórias %</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-streak">0</span>
            <span class="stat-label">Sequência atual</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-max-streak">0</span>
            <span class="stat-label">Melhor sequência</span>
          </div>
        </div>
        <h3>Distribuição de palpites</h3>
        <div id="guess-distribution"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
